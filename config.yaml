# config.yaml — Alluvi LOCAL Image Generation Pipeline
#
# Configures all three stages running locally on the RunPod GPU:
#   Stage 1: local FLUX.1-dev + PuLID  — persona scene generation
#   Stage 2: local Qwen-Image-Edit-2511 — product compositing
#   Stage 3: local FLUX.1-Kontext-dev   — photoreal realism refinement
#
# Per-scenario, Opus 4.7 builds prompt envelopes that may override the
# defaults below. The Step 1 master prompt emits per-scenario
# `fal_pulid_params` with scenario-specific id_weight (1.0 for persona shots,
# 0.5 for flat-lays) and per-scenario true_cfg (1.5 medium, 1.7 close-up).
# Those overrides win when present; defaults are only used as fallback.
#
# (The `fal_*` key names in the envelope are kept for backward compatibility
# with the prompt builders — they carry the same params, just locally
# applied to diffusers pipelines now instead of fal API calls.)

pipeline_name: alluvi_local_image_generation
model_label: "FLUX+PuLID + Qwen-Image-Edit-2511 + FLUX.1-Kontext-dev (local)"

# Per-scenario cost estimate (LLM only — GPU time is tracked at batch level
# as pod hourly rate × wall hours).
cost_per_scenario_usd: 0.30   # = opus_step_1 ($0.10) + opus_step_2 ($0.18) + sonnet_qc (~$0.02)

# ─── Local model paths ──────────────────────────────────────────────────
# Override individual paths via env vars (FLUX_DEV_MODEL_PATH,
# QWEN_EDIT_MODEL_PATH, KONTEXT_MODEL_PATH, PULID_WEIGHTS_PATH,
# INSIGHTFACE_HOME) — useful for testing alternate checkpoints.
model_paths:
  flux_dev:        /workspace/models/FLUX.1-dev
  pulid_weights:   /workspace/models/PuLID
  insightface:     /workspace/models/insightface
  qwen_edit:       /workspace/models/Qwen-Image-Edit-2511
  flux_kontext:    /workspace/models/FLUX.1-Kontext-dev

# ─── Stage 1: FLUX.1-dev + PuLID ────────────────────────────────────────
step_1:
  endpoint: local/flux-pulid
  cost_per_image_usd: 0.0          # local inference; no per-image API cost
  cost_per_prompt_opus_usd: 0.10   # Opus call to build the Step 1 prompt
  defaults:
    image_size:
      width: 768
      height: 1344
    num_inference_steps: 30
    guidance_scale: 3.5
    id_weight: 1.0
    true_cfg: 1.5
    max_sequence_length: 512
    # The following keys are fal-specific and ignored locally:
    # enable_safety_checker, output_format, num_images

# ─── Stage 2: Qwen-Image-Edit-2511 ──────────────────────────────────────
step_2:
  endpoint: local/qwen-image-edit-2511
  cost_per_image_usd: 0.0
  cost_per_prompt_opus_usd: 0.18   # Opus call to build the Step 2 prompt
  defaults:
    image_size:
      width: 768
      height: 1344
    num_inference_steps: 50
    # Qwen-Image-Edit uses true_cfg_scale (not classic guidance_scale).
    # The envelope may still emit `guidance_scale` — the step module accepts both.
    true_cfg_scale: 4.0
    # Fal-only keys (ignored locally): num_images, output_format,
    # enable_safety_checker, acceleration, negative_prompt

# ─── Stage 3: FLUX.1-Kontext-dev ────────────────────────────────────────
step_3:
  endpoint: local/flux-kontext-dev
  cost_per_image_usd: 0.0
  defaults:
    num_inference_steps: 30
    guidance_scale: 2.5
    # No safety_tolerance — Kontext-dev has no safety filter (the
    # bedroom_robe black-image issue is gone with the local model).