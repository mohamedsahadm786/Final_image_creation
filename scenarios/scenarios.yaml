# ════════════════════════════════════════════════════════════════════════════
# scenarios.yaml — Alluvi v2 Hand-Curated Scenario Library
# ════════════════════════════════════════════════════════════════════════════
#
# 30 hand-curated scenarios. Each one is a complete director's brief for one
# UGC-style ad image. Each entry carries everything the prompt builder needs:
# scene, outfit, pose, grip, lighting, mood, framing, camera height.
#
# ─── DESIGN PRINCIPLES ────────────────────────────────────────────────────
# 1. EVERY scenario has the persona in frame WITH the product visible.
#    These images are frame-1 of ad videos — both elements must be present.
# 2. OUTFIT VARIES across all 30 — never repeat. This is the architectural
#    fix for the same-white-sportsbra problem we hit in Phase 1.
# 3. PERSONA stays locked — same face, body type, hair color/length/texture
#    across every scenario. Read from persona.yaml. Never described here.
# 4. SCENE diversity — gym, pilates, bedroom, kitchen, bathroom, outdoor,
#    recovery, office, cafe, yoga, travel. No two scenes use the exact
#    same room.
# 5. POSE diversity — held high, held low, placed on surface, with phone,
#    without phone, three-quarter, full-body, close-up, overhead.
#
# ─── HOW THE PIPELINE USES THIS FILE ──────────────────────────────────────
# Step 1 prompt builder reads:  scene, outfit, pose, hand_assignment,
#                                lighting, mood, palette, framing, camera_height
# Step 2 prompt builder reads:  product placement intent (grip_or_placement),
#                                lighting (to lock the lighting hook),
#                                framing (to keep product in correct position)
# Both builders read:           id, category, archetype, difficulty
# Both builders ignore:         resolves_failure_modes (notes for humans)
#
# ─── ARCHETYPES (4 types — all persona-present) ───────────────────────────
# held_product_high    — product held at chest / face level, prominently visible
# held_product_low     — product held at hip / waist level, casually
# held_with_phone      — mirror selfie with phone in one hand, product in other
# placed_on_surface    — product on a counter / shelf / table near the persona;
#                        persona clearly visible in frame
#
# Note: scenario_loader.py still supports flat_lay and object_in_lineup
# archetypes for future flexibility, but the current scenarios.yaml uses
# only the four persona-present archetypes above.
#
# ─── DIFFICULTY ───────────────────────────────────────────────────────────
# easy    — single-surface placement, low compositing risk
# medium  — single hand placement, full-body or three-quarter framing
# hard    — mirror selfie with phone, close-up face, multi-element scenes
#
# ─── DISTRIBUTION (30 total) ──────────────────────────────────────────────
# Gym                   : 4    (2 medium / 2 hard)
# Pilates studio        : 4    (1 medium / 1 hard / 2 medium)
# Bedroom morning       : 4    (1 medium / 1 hard / 1 medium / 1 medium)
# Kitchen               : 4    (2 medium / 1 medium / 1 hard)
# Bathroom              : 3    (1 medium / 1 medium / 1 hard)
# Recovery / rest       : 3    (1 medium / 1 medium / 1 medium)
# Outdoor lifestyle     : 4    (1 medium / 1 medium / 1 easy / 1 medium)
# Office (NEW)          : 1    (1 medium)
# Cafe (NEW)            : 1    (1 medium)
# Yoga (NEW)            : 1    (1 hard)
# Travel (NEW)          : 1    (1 medium)
# ════════════════════════════════════════════════════════════════════════════

